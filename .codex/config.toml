# Local no-account video MCPs for Agent WebMCP generation.
# Tavall-managed Codex may not inject repo-level MCP config, so scripts/mcp-client.mjs
# remains the shell-accessible bridge for video agents.

[mcp_servers.animotion]
command = "video/agent-webmcp-launch/node_modules/.bin/animotion-mcp"
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.pinepaper]
command = "bash"
args = ["video/agent-webmcp-launch/scripts/pinepaper-mcp.sh"]
startup_timeout_sec = 45
tool_timeout_sec = 180

[mcp_servers.kinocut]
command = "bash"
args = ["video/agent-webmcp-launch/scripts/kinocut-mcp.sh"]
startup_timeout_sec = 90
tool_timeout_sec = 300
