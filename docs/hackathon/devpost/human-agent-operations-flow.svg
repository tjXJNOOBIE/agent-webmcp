<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Human and Agent Operations Flow</title><desc id="desc">A human operator and an agent share one browser operations surface, routing through WebMCP and a canonical typed operation catalog to services and durable jobs.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient>
<style>
.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}
.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}
.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}
.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}
.line{stroke:#7DD3FC;stroke-width:4;fill:none}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker>
<marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>

<text x="82" y="98" class="t title">Human + Agent Operations Flow</text>
<text x="82" y="143" class="t sub m">One surface. One typed catalog. Human or agent.</text>

<rect x="82" y="225" width="300" height="190" rx="28" class="card"/>
<circle cx="132" cy="274" r="26" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="123" y="284" class="t head">1</text>
<text x="116" y="336" class="t head">Human</text>
<text x="116" y="372" class="t small m">Health · services</text><text x="116" y="402" class="t small m">Jobs · execution</text>

<rect x="82" y="485" width="300" height="190" rx="28" class="card"/>
<circle cx="132" cy="534" r="26" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="123" y="544" class="t head">2</text>
<text x="116" y="596" class="t head">Agent</text>
<text x="116" y="632" class="t small m">Discovers tools</text><text x="116" y="662" class="t small m">Sends typed inputs</text>

<rect x="455" y="285" width="320" height="300" rx="30" class="card"/>
<text x="493" y="345" class="t head">Web console</text>
<text x="493" y="400" class="t body">Human controls</text>
<text x="493" y="444" class="t body m">+</text>
<text x="493" y="488" class="t body">WebMCP tools</text>
<text x="493" y="532" class="t small m">same browser surface</text>

<rect x="865" y="285" width="320" height="300" rx="30" class="card"/>
<text x="903" y="345" class="t head">Typed catalog</text>
<text x="903" y="400" class="t body">Stable IDs</text>
<text x="903" y="442" class="t body m">Schemas</text>
<text x="903" y="484" class="t body m">Access rules</text>
<text x="903" y="526" class="t body m">One executor</text>

<rect x="1270" y="225" width="248" height="190" rx="28" class="card"/>
<text x="1305" y="288" class="t head">Services</text>
<text x="1305" y="335" class="t small m">Lifecycle control</text>
<text x="1305" y="374" class="t small m">Logs · health</text>

<rect x="1270" y="485" width="248" height="190" rx="28" class="card"/>
<text x="1290" y="548" class="t head">Durable jobs</text>
<text x="1290" y="595" class="t small m">Schedule · history</text>
<text x="1290" y="634" class="t small m">Codex optional</text>

<path d="M382 320 C420 320 428 372 455 372" class="line" marker-end="url(#a)"/>
<path d="M382 580 C420 580 428 500 455 500" class="line" marker-end="url(#a)"/>
<path d="M775 435 L865 435" class="line" marker-end="url(#a)"/>
<path d="M1185 372 C1225 372 1236 320 1270 320" class="line" marker-end="url(#a)"/>
<path d="M1185 500 C1225 500 1236 580 1270 580" class="line" marker-end="url(#a)"/>

<rect x="455" y="720" width="730" height="92" rx="24" class="soft"/>
<text x="492" y="762" class="t head">Same backend, same visible result</text>
<text x="492" y="797" class="t small m">Both surfaces continue from shared state.</text>

</svg>