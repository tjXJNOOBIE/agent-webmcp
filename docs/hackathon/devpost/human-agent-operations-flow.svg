<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Human and Agent Operations Flow</title>
  <desc id="desc">A human operator and an agent share one browser operations surface, which routes through WebMCP and a canonical operation catalog to services and durable jobs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d12"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7f9"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.m{fill:#94a3b8}.h{font-size:52px;font-weight:700}.s{font-size:24px}.k{font-size:28px;font-weight:650}.b{font-size:21px}.card{fill:#0f172a;stroke:#334155;stroke-width:2}.accent{stroke:url(#accent);stroke-width:5;fill:none}.chip{fill:#172033;stroke:#334155;stroke-width:1.5}.num{fill:#0b1220;stroke:#67e8f9;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1420" cy="110" r="220" fill="#7c3aed" opacity="0.08"/><circle cx="180" cy="780" r="240" fill="#06b6d4" opacity="0.06"/>
  <text x="90" y="105" class="t h">Human + Agent Operations Flow</text>
  <text x="90" y="148" class="t s m">One operational surface. One typed catalog. Two ways to work.</text>

  <rect x="85" y="230" width="260" height="190" rx="28" class="card"/>
  <circle cx="150" cy="292" r="34" class="num"/><text x="138" y="301" class="t k">1</text>
  <text x="115" y="355" class="t k">Human operator</text>
  <text x="115" y="390" class="t b m">Sees health, services,</text><text x="115" y="418" class="t b m">jobs and execution state.</text>

  <rect x="85" y="500" width="260" height="190" rx="28" class="card"/>
  <circle cx="150" cy="562" r="34" class="num"/><text x="138" y="571" class="t k">2</text>
  <text x="115" y="625" class="t k">Agent</text>
  <text x="115" y="660" class="t b m">Discovers page tools and</text><text x="115" y="688" class="t b m">executes structured inputs.</text>

  <rect x="455" y="295" width="300" height="330" rx="30" class="card"/>
  <rect x="487" y="330" width="236" height="58" rx="18" class="chip"/><text x="522" y="368" class="t k">Web console</text>
  <text x="487" y="435" class="t k">Shared browser surface</text>
  <text x="487" y="476" class="t b m">Visual controls for people</text>
  <text x="487" y="509" class="t b m">+</text>
  <text x="487" y="542" class="t b m">document.modelContext</text>
  <text x="487" y="575" class="t b m">tools for agents</text>

  <rect x="865" y="295" width="300" height="330" rx="30" class="card"/>
  <rect x="897" y="330" width="236" height="58" rx="18" class="chip"/><text x="933" y="368" class="t k">Typed catalog</text>
  <text x="897" y="435" class="t k">Canonical operations</text>
  <text x="897" y="476" class="t b m">Stable IDs</text>
  <text x="897" y="509" class="t b m">Descriptions + schemas</text>
  <text x="897" y="542" class="t b m">Access metadata</text>
  <text x="897" y="575" class="t b m">One executor</text>

  <rect x="1275" y="230" width="240" height="190" rx="28" class="card"/>
  <text x="1305" y="300" class="t k">Services</text>
  <text x="1305" y="340" class="t b m">Inspect lifecycle</text>
  <text x="1305" y="372" class="t b m">Start / stop / restart</text>
  <text x="1305" y="404" class="t b m">Logs + health</text>

  <rect x="1275" y="500" width="240" height="190" rx="28" class="card"/>
  <text x="1305" y="570" class="t k">Durable jobs</text>
  <text x="1305" y="610" class="t b m">Schedule + recur</text>
  <text x="1305" y="642" class="t b m">Optional Codex assist</text>
  <text x="1305" y="674" class="t b m">History + output</text>

  <path d="M345 325 C395 325 405 385 455 385" class="accent" marker-end="url(#arrow)"/>
  <path d="M345 595 C395 595 405 535 455 535" class="accent" marker-end="url(#arrow)"/>
  <path d="M755 460 L865 460" class="accent" marker-end="url(#arrow)"/>
  <path d="M1165 395 C1215 395 1225 325 1275 325" class="accent" marker-end="url(#arrow)"/>
  <path d="M1165 525 C1215 525 1225 595 1275 595" class="accent" marker-end="url(#arrow)"/>

  <rect x="455" y="720" width="710" height="92" rx="24" fill="#0c1825" stroke="#1f4050" stroke-width="2"/>
  <text x="490" y="760" class="t k">Result stays visible to both sides</text>
  <text x="490" y="792" class="t b m">The agent acts through the same backend the human UI already understands.</text>
</svg>