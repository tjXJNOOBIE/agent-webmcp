<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Human and Agent Operations Flow</title>
<desc id="desc">A human operator and an agent share one browser operations surface, which routes through WebMCP and a canonical operation catalog to services and durable jobs.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:66px;font-weight:760;letter-spacing:-1.3px}.sub{font-size:30px}.head{font-size:34px;font-weight:700;letter-spacing:-.35px}.body{font-size:27px}.small{font-size:24px}.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}.line{stroke:#7DD3FC;stroke-width:4;fill:none}.badge{fill:#0C1620;stroke:#5FD6F3;stroke-width:2}</style>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="82" y="102" class="t title">Human + Agent Operations Flow</text>
<text x="82" y="148" class="t sub m">One operational surface. One typed catalog. Two ways to work.</text>
<rect x="82" y="220" width="300" height="210" rx="28" class="card"/><circle cx="132" cy="270" r="28" class="badge"/><text x="122" y="281" class="t head">1</text><text x="116" y="340" class="t head">Human operator</text><text x="116" y="382" class="t body m">Sees health, services,</text><text x="116" y="418" class="t body m">jobs and execution state.</text>
<rect x="82" y="490" width="300" height="210" rx="28" class="card"/><circle cx="132" cy="540" r="28" class="badge"/><text x="122" y="551" class="t head">2</text><text x="116" y="610" class="t head">Agent</text><text x="116" y="652" class="t body m">Discovers page tools and</text><text x="116" y="688" class="t body m">executes structured inputs.</text>
<rect x="460" y="278" width="330" height="365" rx="30" class="card"/><text x="496" y="340" class="t head">Web console</text><text x="496" y="390" class="t body">Shared browser surface</text><text x="496" y="440" class="t body m">Visual controls for people</text><text x="496" y="476" class="t body m">+</text><text x="496" y="512" class="t body m">document.modelContext</text><text x="496" y="548" class="t body m">tools for agents</text>
<rect x="875" y="278" width="330" height="365" rx="30" class="card"/><text x="911" y="340" class="t head">Typed catalog</text><text x="911" y="390" class="t body">Canonical operations</text><text x="911" y="440" class="t body m">Stable IDs</text><text x="911" y="476" class="t body m">Descriptions + schemas</text><text x="911" y="512" class="t body m">Access metadata</text><text x="911" y="548" class="t body m">One executor</text>
<rect x="1280" y="220" width="238" height="210" rx="28" class="card"/><text x="1315" y="285" class="t head">Services</text><text x="1315" y="335" class="t small m">Inspect lifecycle</text><text x="1315" y="373" class="t small m">Start / stop / restart</text><text x="1315" y="411" class="t small m">Logs + health</text>
<rect x="1280" y="490" width="238" height="210" rx="28" class="card"/><text x="1315" y="555" class="t head">Durable jobs</text><text x="1315" y="605" class="t small m">Schedule + recur</text><text x="1315" y="643" class="t small m">Optional Codex assist</text><text x="1315" y="681" class="t small m">History + output</text>
<path d="M382 325 C420 325 430 380 460 380" class="line" marker-end="url(#arrow)"/><path d="M382 595 C420 595 430 540 460 540" class="line" marker-end="url(#arrow)"/><path d="M790 460 L875 460" class="line" marker-end="url(#arrow)"/><path d="M1205 380 C1240 380 1250 325 1280 325" class="line" marker-end="url(#arrow)"/><path d="M1205 540 C1240 540 1250 595 1280 595" class="line" marker-end="url(#arrow)"/>
<rect x="460" y="730" width="745" height="100" rx="24" class="soft"/><text x="496" y="774" class="t head">Result stays visible to both sides</text><text x="496" y="811" class="t small m">The agent acts through the same backend the human UI already understands.</text>
</svg>