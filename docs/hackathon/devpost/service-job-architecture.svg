<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Service and Durable Job Architecture</title><desc id="desc">Managed services feed deterministic service jobs and optional Codex-assisted jobs into one durable scheduler with execution history and output.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:66px;font-weight:760;letter-spacing:-1.3px}.sub{font-size:30px}.head{font-size:34px;font-weight:700}.body{font-size:27px}.small{font-size:24px}.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}.line{stroke:#7DD3FC;stroke-width:4;fill:none}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker><marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker></defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/><text x="82" y="102" class="t title">Services + Durable Jobs</text><text x="82" y="148" class="t sub m">Use deterministic automation when possible. Add an agent only when reasoning is useful.</text>
<rect x="82" y="245" width="330" height="380" rx="30" class="card"/><text x="120" y="310" class="t head">Managed service inventory</text><text x="120" y="365" class="t body m">Known services only</text><text x="120" y="410" class="t body m">Lifecycle state</text><text x="120" y="455" class="t body m">Recent output + logs</text><text x="120" y="500" class="t body m">Provider-backed actions</text><rect x="120" y="548" width="254" height="48" rx="15" class="soft"/><text x="155" y="580" class="t small">No generic shell</text>
<rect x="510" y="215" width="430" height="245" rx="30" fill="#0D211D" stroke="#2DD4BF" stroke-width="2"/><text x="550" y="280" class="t head">Deterministic service job</text><text x="550" y="335" class="t body">Restart at 03:00</text><text x="550" y="380" class="t body">Clean logs every Sunday</text><text x="550" y="425" class="t body m">No model required</text>
<rect x="510" y="500" width="430" height="245" rx="30" fill="#181329" stroke="#A78BFA" stroke-width="2"/><text x="550" y="565" class="t head">Optional agent-assisted job</text><text x="550" y="620" class="t body">Prompt + service context</text><text x="550" y="665" class="t body">Installed Codex CLI</text><text x="550" y="710" class="t body m">Used only when reasoning helps</text>
<rect x="1035" y="285" width="475" height="380" rx="32" class="card"/><text x="1078" y="350" class="t head">Durable job runtime</text><text x="1078" y="405" class="t body m">Schedule / recurrence</text><text x="1078" y="450" class="t body m">Execution state</text><text x="1078" y="495" class="t body m">Result + output</text><text x="1078" y="540" class="t body m">History for later inspection</text><rect x="1078" y="585" width="385" height="48" rx="15" class="soft"/><text x="1117" y="617" class="t small">Survives the interactive request</text>
<path d="M412 365 C456 365 468 338 510 338" class="line" marker-end="url(#a)"/><path d="M412 500 C456 500 468 620 510 620" class="dash" marker-end="url(#p)"/><path d="M940 338 C990 338 1000 420 1035 420" class="line" marker-end="url(#a)"/><path d="M940 620 C990 620 1000 530 1035 530" class="dash" marker-end="url(#p)"/>
<rect x="270" y="790" width="1060" height="72" rx="22" class="soft"/><text x="335" y="836" class="t small">One scheduler and history model serves both ordinary automation and agent-assisted work.</text>
</svg>