<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Service and Durable Job Architecture</title><desc id="desc">Managed services feed deterministic service jobs and optional Codex-assisted jobs into one durable scheduler with execution history and output.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d13"/><stop offset="1" stop-color="#111827"/></linearGradient><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.m{fill:#94a3b8}.h{font-size:52px;font-weight:700}.s{font-size:24px}.k{font-size:27px;font-weight:650}.b{font-size:21px}.card{fill:#0f172a;stroke:#334155;stroke-width:2}.good{fill:#09251f;stroke:#2dd4bf;stroke-width:2}.agent{fill:#1b1433;stroke:#a78bfa;stroke-width:2}.line{stroke:#67e8f9;stroke-width:4;fill:none}.dash{stroke:#a78bfa;stroke-width:4;stroke-dasharray:10 9;fill:none}</style><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker><marker id="p" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#a78bfa"/></marker></defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="90" y="105" class="t h">Services + Durable Jobs</text><text x="90" y="148" class="t s m">Use deterministic automation when possible. Add an agent only when reasoning is useful.</text>

  <rect x="95" y="260" width="300" height="330" rx="30" class="card"/><text x="130" y="320" class="t k">Managed service inventory</text><text x="130" y="370" class="t b m">Known services only</text><text x="130" y="410" class="t b m">Lifecycle state</text><text x="130" y="450" class="t b m">Recent output + logs</text><text x="130" y="490" class="t b m">Provider-backed actions</text><rect x="130" y="520" width="225" height="42" rx="14" fill="#111d2d"/><text x="155" y="548" class="t b">No generic shell</text>

  <rect x="520" y="220" width="390" height="220" rx="30" class="good"/><text x="555" y="280" class="t k">Deterministic service job</text><text x="555" y="330" class="t b">Restart at 03:00</text><text x="555" y="365" class="t b">Clean logs every Sunday</text><text x="555" y="400" class="t b m">No model required</text>

  <rect x="520" y="500" width="390" height="220" rx="30" class="agent"/><text x="555" y="560" class="t k">Optional agent-assisted job</text><text x="555" y="610" class="t b">Prompt + service context</text><text x="555" y="645" class="t b">Installed Codex CLI</text><text x="555" y="680" class="t b m">Used only when reasoning helps</text>

  <rect x="1035" y="300" width="430" height="340" rx="34" class="card"/><text x="1075" y="365" class="t k">Durable job runtime</text><text x="1075" y="420" class="t b m">Schedule / recurrence</text><text x="1075" y="460" class="t b m">Execution state</text><text x="1075" y="500" class="t b m">Result + output</text><text x="1075" y="540" class="t b m">History for later inspection</text><rect x="1075" y="575" width="330" height="38" rx="12" fill="#0c2027"/><text x="1110" y="601" class="t b">Survives the interactive request</text>

  <path d="M395 370 C450 370 465 330 520 330" class="line" marker-end="url(#a)"/><path d="M395 485 C450 485 465 610 520 610" class="dash" marker-end="url(#p)"/><path d="M910 330 C970 330 980 405 1035 405" class="line" marker-end="url(#a)"/><path d="M910 610 C970 610 980 535 1035 535" class="dash" marker-end="url(#p)"/>

  <rect x="265" y="785" width="1070" height="65" rx="20" fill="#0b1420" stroke="#334155"/><text x="340" y="826" class="t b">One scheduler and history model serves both ordinary automation and agent-assisted work.</text>
</svg>