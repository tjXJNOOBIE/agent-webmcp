<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Service and Durable Job Architecture</title><desc id="desc">Managed services feed deterministic service jobs and optional Codex-assisted jobs into one durable scheduler with execution history and output.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient>
<style>
.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}
.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}
.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}
.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}
.line{stroke:#7DD3FC;stroke-width:4;fill:none}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker>
<marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>

<text x="82" y="98" class="t title">Services + Durable Jobs</text>
<text x="82" y="143" class="t sub m">Use deterministic automation first. Add an agent when reasoning helps.</text>

<rect x="82" y="235" width="330" height="370" rx="30" class="card"/>
<text x="120" y="300" class="t head">Inventory</text>
<text x="120" y="360" class="t body m">Known inventory</text>
<text x="120" y="405" class="t body m">Lifecycle state</text>
<text x="120" y="450" class="t body m">Logs + output</text>
<text x="120" y="495" class="t body m">Provider actions</text>
<rect x="120" y="535" width="250" height="46" rx="15" class="soft"/><text x="168" y="566" class="t small">No generic shell</text>

<rect x="510" y="210" width="430" height="235" rx="30" fill="#0D211D" stroke="#2DD4BF" stroke-width="2"/>
<text x="550" y="270" class="t head">Deterministic job</text>
<text x="550" y="325" class="t body">Restart at 03:00</text>
<text x="550" y="370" class="t body">Clean logs Sundays</text>
<text x="550" y="412" class="t body m">No model</text>

<rect x="510" y="485" width="430" height="235" rx="30" fill="#181329" stroke="#A78BFA" stroke-width="2"/>
<text x="550" y="545" class="t head">Agent-assisted job</text>
<text x="550" y="600" class="t body">Prompt + context</text>
<text x="550" y="645" class="t body">Installed Codex CLI</text>
<text x="550" y="688" class="t body m">Only when reasoning helps</text>

<rect x="1035" y="270" width="475" height="360" rx="32" class="card"/>
<text x="1078" y="335" class="t head">Durable runtime</text>
<text x="1078" y="395" class="t body m">Schedule / recur</text>
<text x="1078" y="440" class="t body m">Execution state</text>
<text x="1078" y="485" class="t body m">Result + output</text>
<text x="1078" y="530" class="t body m">History</text>
<rect x="1078" y="560" width="385" height="46" rx="15" class="soft"/><text x="1160" y="591" class="t small">Survives requests</text>

<path d="M412 350 C458 350 470 328 510 328" class="line" marker-end="url(#a)"/>
<path d="M412 500 C458 500 470 600 510 600" class="dash" marker-end="url(#p)"/>
<path d="M940 328 C990 328 1000 410 1035 410" class="line" marker-end="url(#a)"/>
<path d="M940 600 C990 600 1000 500 1035 500" class="dash" marker-end="url(#p)"/>

<rect x="350" y="785" width="900" height="70" rx="22" class="soft"/>
<text x="610" y="830" class="t body">One durable runtime for both.</text>

</svg>