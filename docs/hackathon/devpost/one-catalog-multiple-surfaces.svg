<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">One Catalog, Multiple Surfaces</title><desc id="desc">A canonical Java operation catalog projects the same typed operations to the web console, HTTP API, CLI, WebMCP, and bounded MCP endpoint.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient>
<style>
.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}
.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}
.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}
.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}
.line{stroke:#7DD3FC;stroke-width:4;fill:none}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker>
<marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>

<text x="82" y="98" class="t title">One Catalog, Multiple Surfaces</text>
<text x="82" y="143" class="t sub m">The AI interface projects the product. It is not a second backend.</text>

<rect x="545" y="210" width="510" height="430" rx="34" fill="#0D1A25" stroke="#5FD6F3" stroke-width="2.5"/>
<text x="590" y="270" class="t head">Canonical Java Catalog</text>
<text x="590" y="330" class="t body m">ID</text><text x="780" y="330" class="t body">system.status</text>
<text x="590" y="380" class="t body m">Description</text><text x="780" y="380" class="t body">Human + agent</text>
<text x="590" y="430" class="t body m">Input</text><text x="780" y="430" class="t body">Typed schema</text>
<text x="590" y="480" class="t body m">Access</text><text x="780" y="480" class="t body">Read / mutate</text>
<text x="590" y="530" class="t body m">Executor</text><text x="780" y="530" class="t body">One implementation</text>
<rect x="590" y="570" width="420" height="44" rx="14" class="soft"/><text x="675" y="599" class="t small">No duplicate tool logic</text>

<rect x="90" y="240" width="330" height="150" rx="28" class="card"/><text x="125" y="300" class="t head">Web console</text><text x="125" y="348" class="t body m">Human controls</text>
<rect x="90" y="475" width="330" height="150" rx="28" class="card"/><text x="125" y="535" class="t head">HTTP / JSON API</text><text x="125" y="583" class="t body m">Integrations</text>
<rect x="1180" y="240" width="330" height="150" rx="28" class="card"/><text x="1215" y="300" class="t head">WebMCP</text><text x="1215" y="348" class="t body m">Browser-native tools</text>
<rect x="1180" y="475" width="330" height="150" rx="28" class="card"/><text x="1215" y="535" class="t head">Bounded MCP</text><text x="1215" y="583" class="t body m">Smaller projection</text>
<rect x="650" y="690" width="300" height="115" rx="28" class="card"/><text x="770" y="744" class="t head">CLI</text><text x="700" y="784" class="t small m">Local operator</text>

<path d="M545 330 L420 315" class="line" marker-end="url(#a)"/><path d="M545 505 L420 550" class="line" marker-end="url(#a)"/>
<path d="M1055 330 L1180 315" class="line" marker-end="url(#a)"/><path d="M1055 505 L1180 550" class="line" marker-end="url(#a)"/><path d="M800 640 L800 690" class="line" marker-end="url(#a)"/>

<rect x="90" y="700" width="430" height="105" rx="24" class="soft"/><text x="125" y="744" class="t head">Same semantics</text><text x="125" y="782" class="t small m">A restart means the same thing.</text>
<rect x="1080" y="700" width="430" height="105" rx="24" class="soft"/><text x="1115" y="744" class="t head">Scoped exposure</text><text x="1115" y="782" class="t small m">Each surface may expose less.</text>

</svg>