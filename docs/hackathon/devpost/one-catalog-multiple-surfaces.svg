<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">One Catalog, Multiple Surfaces</title><desc id="desc">A canonical Java operation catalog projects the same typed operations to the web console, HTTP API, CLI, WebMCP, and bounded MCP endpoint.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:66px;font-weight:760;letter-spacing:-1.3px}.sub{font-size:30px}.head{font-size:31px;font-weight:700}.corehead{font-size:33px;font-weight:700}.body{font-size:26px}.small{font-size:23px}.card{fill:#111823;stroke:#2B3646;stroke-width:2}.core{fill:#0D1A25;stroke:#5FD6F3;stroke-width:2.5}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}.line{stroke:#7DD3FC;stroke-width:4;fill:none}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker></defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/><text x="82" y="102" class="t title">One Catalog, Multiple Surfaces</text><text x="82" y="148" class="t sub m">The AI interface is a projection of the product, not a second product to maintain.</text>
<rect x="545" y="220" width="510" height="435" rx="34" class="core"/><text x="592" y="282" class="t corehead">Canonical Java Operation Catalog</text>
<text x="592" y="340" class="t body m">Operation ID</text><text x="810" y="340" class="t body">system.status</text>
<text x="592" y="390" class="t body m">Description</text><text x="810" y="390" class="t body">Human + agent readable</text>
<text x="592" y="440" class="t body m">Input schema</text><text x="810" y="440" class="t body">Generated from typed</text><text x="810" y="472" class="t body">records</text>
<text x="592" y="522" class="t body m">Access</text><text x="810" y="522" class="t body">Read / mutation metadata</text>
<text x="592" y="572" class="t body m">Executor</text><text x="810" y="572" class="t body">One implementation</text>
<rect x="592" y="598" width="416" height="42" rx="14" class="soft"/><text x="665" y="627" class="t small">No duplicated AI tool logic</text>
<rect x="90" y="245" width="330" height="160" rx="28" class="card"/><text x="125" y="310" class="t head">Human web console</text><text x="125" y="357" class="t body m">Buttons, panels, state</text><rect x="90" y="490" width="330" height="160" rx="28" class="card"/><text x="125" y="555" class="t head">HTTP / JSON API</text><text x="125" y="602" class="t body m">Structured integrations</text>
<rect x="1180" y="245" width="330" height="160" rx="28" class="card"/><text x="1215" y="310" class="t head">Browser WebMCP</text><text x="1215" y="357" class="t body m">Page-native agent tools</text><rect x="1180" y="490" width="330" height="160" rx="28" class="card"/><text x="1215" y="555" class="t head">Bounded MCP</text><text x="1215" y="602" class="t body m">Smaller remote projection</text>
<rect x="650" y="700" width="300" height="120" rx="28" class="card"/><text x="772" y="755" class="t head">CLI</text><text x="704" y="798" class="t small m">Local operator surface</text>
<path d="M545 350 L420 325" class="line" marker-end="url(#a)"/><path d="M545 525 L420 570" class="line" marker-end="url(#a)"/><path d="M1055 350 L1180 325" class="line" marker-end="url(#a)"/><path d="M1055 525 L1180 570" class="line" marker-end="url(#a)"/><path d="M800 655 L800 700" class="line" marker-end="url(#a)"/>
<rect x="90" y="710" width="430" height="110" rx="24" class="soft"/><text x="125" y="752" class="t head">Same operation semantics</text><text x="125" y="795" class="t small m">A restart means the same thing everywhere.</text><rect x="1080" y="710" width="430" height="110" rx="24" class="soft"/><text x="1115" y="752" class="t head">Surface-specific exposure</text><text x="1115" y="795" class="t small m">Each interface can intentionally expose less.</text>
</svg>