<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Human-Agent Collaboration Loop</title><desc id="desc">A six-step loop: observe, ask, plan, execute typed operation, verify in the UI, and continue with shared state.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:66px;font-weight:760;letter-spacing:-1.3px}.sub{font-size:30px}.head{font-size:30px;font-weight:700}.small{font-size:22px}.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}.badge{fill:#0C1620;stroke:#5FD6F3;stroke-width:2}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}</style><marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker></defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/><text x="82" y="102" class="t title">Human-Agent Collaboration Loop</text><text x="82" y="148" class="t sub m">The agent acts, the person stays oriented, and both continue from the same visible state.</text>
<circle cx="800" cy="485" r="232" stroke="url(#accent)" stroke-width="4.5" fill="none" stroke-dasharray="14 11"/><circle cx="800" cy="485" r="118" class="soft"/><text x="717" y="468" class="t head">Shared state</text><text x="682" y="511" class="t small m">Dashboard + WebMCP</text><text x="714" y="544" class="t small m">same backend</text>
<g transform="translate(635 202)"><rect width="330" height="142" rx="24" class="card"/><circle cx="44" cy="43" r="25" class="badge"/><text x="34" y="53" class="t head">1</text><text x="90" y="52" class="t head">Observe</text><text x="32" y="97" class="t small m">Human sees real</text><text x="32" y="126" class="t small m">machine state</text></g>
<g transform="translate(1040 300)"><rect width="330" height="142" rx="24" class="card"/><circle cx="44" cy="43" r="25" class="badge"/><text x="34" y="53" class="t head">2</text><text x="90" y="52" class="t head">Ask</text><text x="32" y="97" class="t small m">Describe the desired</text><text x="32" y="126" class="t small m">outcome</text></g>
<g transform="translate(1040 580)"><rect width="330" height="142" rx="24" class="card"/><circle cx="44" cy="43" r="25" class="badge"/><text x="34" y="53" class="t head">3</text><text x="90" y="52" class="t head">Plan</text><text x="32" y="97" class="t small m">Agent selects available</text><text x="32" y="126" class="t small m">tools</text></g>
<g transform="translate(635 700)"><rect width="330" height="142" rx="24" class="card"/><circle cx="44" cy="43" r="25" class="badge"/><text x="34" y="53" class="t head">4</text><text x="90" y="52" class="t head">Execute</text><text x="32" y="97" class="t small m">Run typed bounded</text><text x="32" y="126" class="t small m">operation</text></g>
<g transform="translate(230 580)"><rect width="330" height="142" rx="24" class="card"/><circle cx="44" cy="43" r="25" class="badge"/><text x="34" y="53" class="t head">5</text><text x="90" y="52" class="t head">Verify</text><text x="32" y="97" class="t small m">Result appears in the</text><text x="32" y="126" class="t small m">console</text></g>
<g transform="translate(230 300)"><rect width="330" height="142" rx="24" class="card"/><circle cx="44" cy="43" r="25" class="badge"/><text x="34" y="53" class="t head">6</text><text x="90" y="52" class="t head">Continue</text><text x="32" y="97" class="t small m">Next action uses</text><text x="32" y="126" class="t small m">updated state</text></g>
<path d="M965 260 C1010 268 1040 285 1088 305" class="dash" marker-end="url(#p)"/><path d="M1370 442 C1390 492 1387 540 1358 580" class="dash" marker-end="url(#p)"/><path d="M1040 722 C1002 752 985 770 965 770" class="dash" marker-end="url(#p)"/><path d="M635 770 C600 770 585 752 560 722" class="dash" marker-end="url(#p)"/><path d="M230 580 C205 540 202 492 230 442" class="dash" marker-end="url(#p)"/><path d="M560 305 C595 280 610 268 635 260" class="dash" marker-end="url(#p)"/>
</svg>