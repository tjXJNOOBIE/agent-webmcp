<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Human-Agent Collaboration Loop</title><desc id="desc">A six-step loop: observe, ask, plan, execute typed operation, verify in the UI, and continue with shared state.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient>
<style>
.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}
.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}
.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}
.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}
.line{stroke:#7DD3FC;stroke-width:4;fill:none}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker>
<marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>

<text x="82" y="98" class="t title">Human-Agent Collaboration Loop</text>
<text x="82" y="143" class="t sub m">Act, verify, and continue from the same visible state.</text>
<circle cx="800" cy="485" r="220" fill="#0D141E" stroke="#263243" stroke-width="2"/>
<circle cx="800" cy="485" r="250" stroke="#A78BFA" stroke-width="4" fill="none" stroke-dasharray="12 10"/>
<text x="714" y="470" class="t head">Shared state</text>
<text x="690" y="512" class="t body m">Dashboard + WebMCP</text>

<g transform="translate(635 205)"><rect width="330" height="130" rx="24" class="card"/><circle cx="44" cy="42" r="24" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="35" y="52" class="t head">1</text><text x="86" y="51" class="t head">Observe</text><text x="32" y="98" class="t body m">See live state</text></g>
<g transform="translate(1050 310)"><rect width="300" height="130" rx="24" class="card"/><circle cx="44" cy="42" r="24" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="35" y="52" class="t head">2</text><text x="86" y="51" class="t head">Ask</text><text x="32" y="98" class="t body m">State the outcome</text></g>
<g transform="translate(1050 570)"><rect width="300" height="130" rx="24" class="card"/><circle cx="44" cy="42" r="24" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="35" y="52" class="t head">3</text><text x="86" y="51" class="t head">Plan</text><text x="32" y="98" class="t body m">Choose tools</text></g>
<g transform="translate(635 705)"><rect width="330" height="130" rx="24" class="card"/><circle cx="44" cy="42" r="24" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="35" y="52" class="t head">4</text><text x="86" y="51" class="t head">Execute</text><text x="32" y="98" class="t body m">Run typed operation</text></g>
<g transform="translate(250 570)"><rect width="300" height="130" rx="24" class="card"/><circle cx="44" cy="42" r="24" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="35" y="52" class="t head">5</text><text x="86" y="51" class="t head">Verify</text><text x="32" y="98" class="t body m">Check result</text></g>
<g transform="translate(250 310)"><rect width="300" height="130" rx="24" class="card"/><circle cx="44" cy="42" r="24" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="35" y="52" class="t head">6</text><text x="86" y="51" class="t head">Continue</text><text x="32" y="98" class="t body m">Use updated state</text></g>

</svg>