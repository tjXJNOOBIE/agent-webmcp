<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Human-Agent Collaboration Loop</title><desc id="desc">A six-step loop: observe, ask, plan, execute typed operation, verify in the UI, and continue with shared state.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d13"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.m{fill:#94a3b8}.h{font-size:52px;font-weight:700}.s{font-size:24px}.k{font-size:26px;font-weight:650}.b{font-size:20px}.card{fill:#0f172a;stroke:#334155;stroke-width:2}.num{fill:#0b1724;stroke:#67e8f9;stroke-width:2}.ring{stroke:url(#ring);stroke-width:5;fill:none;stroke-dasharray:14 10}</style><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#a78bfa"/></marker></defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="90" y="105" class="t h">Human-Agent Collaboration Loop</text><text x="90" y="148" class="t s m">The agent acts, the person stays oriented, and both continue from the same visible state.</text>

  <circle cx="800" cy="490" r="250" class="ring"/>
  <circle cx="800" cy="490" r="120" fill="#0b1420" stroke="#334155" stroke-width="2"/><text x="715" y="470" class="t k">Shared state</text><text x="670" y="510" class="t b m">Dashboard + WebMCP</text><text x="696" y="542" class="t b m">same backend</text>

  <g transform="translate(665 205)"><rect width="270" height="120" rx="24" class="card"/><circle cx="42" cy="42" r="24" class="num"/><text x="34" y="50" class="t k">1</text><text x="85" y="47" class="t k">Observe</text><text x="30" y="88" class="t b m">Human sees real machine state</text></g>
  <g transform="translate(1045 315)"><rect width="300" height="120" rx="24" class="card"/><circle cx="42" cy="42" r="24" class="num"/><text x="34" y="50" class="t k">2</text><text x="85" y="47" class="t k">Ask</text><text x="30" y="88" class="t b m">Describe the desired outcome</text></g>
  <g transform="translate(1050 585)"><rect width="300" height="120" rx="24" class="card"/><circle cx="42" cy="42" r="24" class="num"/><text x="34" y="50" class="t k">3</text><text x="85" y="47" class="t k">Plan</text><text x="30" y="88" class="t b m">Agent selects available tools</text></g>
  <g transform="translate(665 705)"><rect width="270" height="120" rx="24" class="card"/><circle cx="42" cy="42" r="24" class="num"/><text x="34" y="50" class="t k">4</text><text x="85" y="47" class="t k">Execute</text><text x="30" y="88" class="t b m">Run typed bounded operation</text></g>
  <g transform="translate(250 585)"><rect width="300" height="120" rx="24" class="card"/><circle cx="42" cy="42" r="24" class="num"/><text x="34" y="50" class="t k">5</text><text x="85" y="47" class="t k">Verify</text><text x="30" y="88" class="t b m">Result appears in the console</text></g>
  <g transform="translate(250 315)"><rect width="300" height="120" rx="24" class="card"/><circle cx="42" cy="42" r="24" class="num"/><text x="34" y="50" class="t k">6</text><text x="85" y="47" class="t k">Continue</text><text x="30" y="88" class="t b m">Next action uses updated state</text></g>

  <path d="M935 260 C1030 270 1065 285 1115 315" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1345 435 C1380 500 1375 540 1340 585" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M1050 705 C1005 755 980 770 935 770" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M665 770 C610 770 585 755 550 705" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M250 585 C215 540 215 500 250 435" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M550 315 C595 280 625 270 665 260" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a)"/>
</svg>