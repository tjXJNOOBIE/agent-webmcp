<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">WebMCP Registration Flow</title><desc id="desc">The browser loads the canonical operation catalog, registers tools with document.modelContext, and executes through the canonical operation API with cancellation support.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:66px;font-weight:760;letter-spacing:-1.3px}.sub{font-size:30px}.step{font-size:28px;font-weight:700}.body{font-size:26px}.small{font-size:23px}.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}.line{stroke:#7DD3FC;stroke-width:4;fill:none}.badge{fill:#0C1620;stroke:#5FD6F3;stroke-width:2}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker></defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/><text x="82" y="102" class="t title">Browser-Native WebMCP Registration</text><text x="82" y="148" class="t sub m">The page discovers real application operations and publishes them as typed tools.</text>
<g transform="translate(82 230)"><rect width="270" height="220" rx="28" class="card"/><circle cx="48" cy="48" r="27" class="badge"/><text x="38" y="58" class="t step">1</text><text x="32" y="112" class="t step">Load catalog</text><text x="32" y="160" class="t small m">GET canonical operation</text><text x="32" y="197" class="t small m">metadata from backend</text></g>
<g transform="translate(382 230)"><rect width="270" height="220" rx="28" class="card"/><circle cx="48" cy="48" r="27" class="badge"/><text x="38" y="58" class="t step">2</text><text x="32" y="112" class="t step">Register tools</text><text x="32" y="160" class="t small m">document.modelContext</text><text x="32" y="197" class="t small m">.registerTool(...)</text></g>
<g transform="translate(682 230)"><rect width="270" height="220" rx="28" class="card"/><circle cx="48" cy="48" r="27" class="badge"/><text x="38" y="58" class="t step">3</text><text x="32" y="112" class="t step">Publish metadata</text><text x="32" y="160" class="t small m">Name + description</text><text x="32" y="197" class="t small m">schema + annotations</text></g>
<g transform="translate(982 230)"><rect width="270" height="220" rx="28" class="card"/><circle cx="48" cy="48" r="27" class="badge"/><text x="38" y="58" class="t step">4</text><text x="32" y="112" class="t step">Agent executes</text><text x="32" y="160" class="t small m">Structured input only</text><text x="32" y="197" class="t small m">No UI scraping required</text></g>
<g transform="translate(1282 230)"><rect width="236" height="220" rx="28" class="card"/><circle cx="48" cy="48" r="27" class="badge"/><text x="38" y="58" class="t step">5</text><text x="32" y="112" class="t step">Run</text><text x="32" y="160" class="t small m">POST to</text><text x="32" y="197" class="t small m">canonical API</text></g>
<path d="M352 340 L382 340" class="line" marker-end="url(#a)"/><path d="M652 340 L682 340" class="line" marker-end="url(#a)"/><path d="M952 340 L982 340" class="line" marker-end="url(#a)"/><path d="M1252 340 L1282 340" class="line" marker-end="url(#a)"/>
<rect x="180" y="535" width="1240" height="245" rx="30" class="soft"/><text x="225" y="594" class="t step">What each tool receives</text><text x="225" y="648" class="t body m">name</text><text x="390" y="648" class="t body">operation.id</text><text x="225" y="694" class="t body m">inputSchema</text><text x="390" y="694" class="t body">generated from canonical typed input records</text><text x="225" y="740" class="t body m">AbortSignal</text><text x="390" y="740" class="t body">forwarded into fetch so cancellation survives the full path</text><text x="840" y="648" class="t body m">annotations</text><text x="1030" y="648" class="t body">readOnlyHint where appropriate</text><text x="840" y="694" class="t body m">execute</text><text x="1030" y="694" class="t body">canonical operation endpoint</text>
<rect x="420" y="816" width="760" height="58" rx="18" fill="#0C1C25" stroke="#245064" stroke-width="2"/><text x="490" y="854" class="t small">WebMCP describes what the application can already safely do.</text>
</svg>