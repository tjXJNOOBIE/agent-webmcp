<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WebMCP Registration Flow</title><desc id="desc">The browser loads the canonical operation catalog, registers tools with document.modelContext, and executes through the canonical operation API with cancellation support.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d13"/><stop offset="1" stop-color="#121827"/></linearGradient>
    <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.m{fill:#94a3b8}.h{font-size:52px;font-weight:700}.s{font-size:24px}.k{font-size:25px;font-weight:650}.b{font-size:20px}.card{fill:#0f172a;stroke:#334155;stroke-width:2}.code{fill:#08131e;stroke:#164e63;stroke-width:2}.line{stroke:#67e8f9;stroke-width:4;fill:none}.n{fill:#0b1724;stroke:#67e8f9;stroke-width:2}</style>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="90" y="105" class="t h">Browser-Native WebMCP Registration</text>
  <text x="90" y="148" class="t s m">The page discovers real application operations and publishes them as typed tools.</text>

  <g transform="translate(90 245)">
    <rect width="250" height="210" rx="28" class="card"/><circle cx="45" cy="45" r="25" class="n"/><text x="37" y="53" class="t k">1</text>
    <text x="30" y="100" class="t k">Load catalog</text><text x="30" y="140" class="t b m">GET canonical operation</text><text x="30" y="170" class="t b m">metadata from backend</text>
  </g>
  <g transform="translate(405 245)">
    <rect width="250" height="210" rx="28" class="card"/><circle cx="45" cy="45" r="25" class="n"/><text x="37" y="53" class="t k">2</text>
    <text x="30" y="100" class="t k">Register tools</text><text x="30" y="140" class="t b m">document.modelContext</text><text x="30" y="170" class="t b m">.registerTool(...)</text>
  </g>
  <g transform="translate(720 245)">
    <rect width="250" height="210" rx="28" class="card"/><circle cx="45" cy="45" r="25" class="n"/><text x="37" y="53" class="t k">3</text>
    <text x="30" y="100" class="t k">Publish metadata</text><text x="30" y="140" class="t b m">Name + description</text><text x="30" y="170" class="t b m">schema + annotations</text>
  </g>
  <g transform="translate(1035 245)">
    <rect width="250" height="210" rx="28" class="card"/><circle cx="45" cy="45" r="25" class="n"/><text x="37" y="53" class="t k">4</text>
    <text x="30" y="100" class="t k">Agent executes</text><text x="30" y="140" class="t b m">Structured input only</text><text x="30" y="170" class="t b m">No UI scraping required</text>
  </g>
  <g transform="translate(1350 245)">
    <rect width="160" height="210" rx="28" class="card"/><circle cx="45" cy="45" r="25" class="n"/><text x="37" y="53" class="t k">5</text>
    <text x="30" y="100" class="t k">Run</text><text x="30" y="140" class="t b m">POST to</text><text x="30" y="170" class="t b m">canonical API</text>
  </g>

  <path d="M340 350 L405 350" class="line" marker-end="url(#a)"/><path d="M655 350 L720 350" class="line" marker-end="url(#a)"/><path d="M970 350 L1035 350" class="line" marker-end="url(#a)"/><path d="M1285 350 L1350 350" class="line" marker-end="url(#a)"/>

  <rect x="245" y="555" width="1110" height="220" rx="30" class="code"/>
  <text x="285" y="610" class="t k">What each tool receives</text>
  <text x="285" y="660" class="t b m">name</text><text x="390" y="660" class="t b">operation.id</text>
  <text x="285" y="700" class="t b m">inputSchema</text><text x="390" y="700" class="t b">generated from canonical typed input records</text>
  <text x="785" y="660" class="t b m">annotations</text><text x="930" y="660" class="t b">readOnlyHint where appropriate</text>
  <text x="785" y="700" class="t b m">execute</text><text x="930" y="700" class="t b">canonical operation endpoint</text>
  <text x="285" y="740" class="t b m">AbortSignal</text><text x="390" y="740" class="t b">forwarded into fetch so cancellation survives the full path</text>

  <rect x="470" y="805" width="660" height="54" rx="18" fill="#0c2027" stroke="#155e75"/><text x="540" y="840" class="t b">WebMCP describes what the application can already safely do.</text>
</svg>