<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">WebMCP Registration Flow</title><desc id="desc">The browser loads the canonical operation catalog, registers tools with document.modelContext, and executes through the canonical operation API with cancellation support.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient>
<style>
.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}
.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}
.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}
.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}
.line{stroke:#7DD3FC;stroke-width:4;fill:none}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker>
<marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>

<text x="82" y="98" class="t title">Browser-Native WebMCP Registration</text>
<text x="82" y="143" class="t sub m">Publish safe application operations as typed browser tools.</text>

<g transform="translate(82 225)"><rect width="270" height="205" rx="28" class="card"/><circle cx="48" cy="48" r="25" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="39" y="58" class="t head">1</text><text x="32" y="110" class="t head">Load catalog</text><text x="32" y="160" class="t body m">Canonical metadata</text></g>
<g transform="translate(382 225)"><rect width="270" height="205" rx="28" class="card"/><circle cx="48" cy="48" r="25" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="39" y="58" class="t head">2</text><text x="32" y="110" class="t head">Register</text><text x="32" y="154" class="t small m">modelContext</text><text x="32" y="182" class="t small m">registerTool(...)</text></g>
<g transform="translate(682 225)"><rect width="270" height="205" rx="28" class="card"/><circle cx="48" cy="48" r="25" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="39" y="58" class="t head">3</text><text x="32" y="110" class="t head">Publish</text><text x="32" y="154" class="t small m">Name · schema</text><text x="32" y="182" class="t small m">Hints</text></g>
<g transform="translate(982 225)"><rect width="270" height="205" rx="28" class="card"/><circle cx="48" cy="48" r="25" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="39" y="58" class="t head">4</text><text x="32" y="110" class="t head">Agent call</text><text x="32" y="160" class="t body m">Structured input</text></g>
<g transform="translate(1282 225)"><rect width="236" height="205" rx="28" class="card"/><circle cx="48" cy="48" r="25" fill="#0C1620" stroke="#5FD6F3" stroke-width="2"/><text x="39" y="58" class="t head">5</text><text x="32" y="110" class="t head">Execute</text><text x="32" y="160" class="t body m">Canonical API</text></g>
<path d="M352 330 L382 330" class="line" marker-end="url(#a)"/><path d="M652 330 L682 330" class="line" marker-end="url(#a)"/><path d="M952 330 L982 330" class="line" marker-end="url(#a)"/><path d="M1252 330 L1282 330" class="line" marker-end="url(#a)"/>

<rect x="180" y="510" width="1240" height="250" rx="30" class="soft"/>
<text x="225" y="568" class="t head">Tool contract</text>
<text x="225" y="625" class="t body m">name</text><text x="410" y="625" class="t body">operation.id</text>
<text x="225" y="675" class="t body m">inputSchema</text><text x="410" y="675" class="t body">typed input records</text>
<text x="860" y="625" class="t body m">annotations</text><text x="1050" y="625" class="t body">readOnlyHint</text>
<text x="860" y="675" class="t body m">execute</text><text x="1050" y="675" class="t body">canonical endpoint</text>
<text x="225" y="725" class="t body m">AbortSignal</text><text x="410" y="725" class="t body">forwarded to fetch</text>

<rect x="430" y="808" width="740" height="54" rx="18" fill="#0C1C25" stroke="#245064" stroke-width="2"/>
<text x="560" y="843" class="t small">Page tools mirror safe app operations.</text>

</svg>