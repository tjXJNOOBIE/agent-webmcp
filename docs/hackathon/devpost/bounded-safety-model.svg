<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Bounded Safety Model</title><desc id="desc">Agent WebMCP exposes typed managed service and job operations while intentionally excluding arbitrary shell, unrestricted filesystem mutation, arbitrary process execution, recursive jobs, hidden AI-only backends, public root control planes, and inventory-bypassing behavior.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient>
<style>
.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}
.m{fill:#A8B3C4}.title{font-size:60px;font-weight:760;letter-spacing:-1.1px}.sub{font-size:27px}
.head{font-size:30px;font-weight:700}.body{font-size:24px}.small{font-size:21px}
.card{fill:#111823;stroke:#2B3646;stroke-width:2}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}
.line{stroke:#7DD3FC;stroke-width:4;fill:none}.dash{stroke:#A78BFA;stroke-width:4;stroke-dasharray:12 10;fill:none}
</style>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7DD3FC"/></marker>
<marker id="p" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#A78BFA"/></marker>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>

<text x="82" y="98" class="t title">Bounded by Design</text>
<text x="82" y="143" class="t sub m">Operational power without turning the browser into a remote shell.</text>

<rect x="82" y="215" width="680" height="505" rx="32" fill="#0D211D" stroke="#34D399" stroke-width="2"/>
<text x="125" y="280" class="t head">Typed operations</text>
<g fill="#34D399">
<circle cx="137" cy="333" r="6"/><circle cx="137" cy="383" r="6"/><circle cx="137" cy="433" r="6"/><circle cx="137" cy="483" r="6"/><circle cx="137" cy="533" r="6"/><circle cx="137" cy="583" r="6"/><circle cx="137" cy="633" r="6"/>
</g>
<text x="160" y="341" class="t body">Status + metrics</text>
<text x="160" y="391" class="t body">Service discovery</text>
<text x="160" y="441" class="t body">Lifecycle controls</text>
<text x="160" y="491" class="t body">Logs + output</text>
<text x="160" y="541" class="t body">Inventory changes</text>
<text x="160" y="591" class="t body">Durable jobs + history</text>
<text x="160" y="641" class="t body">Optional Codex prompts</text>
<rect x="125" y="665" width="590" height="40" rx="13" fill="#103128"/><text x="295" y="692" class="t small">Known domain behavior only</text>

<rect x="838" y="215" width="680" height="505" rx="32" fill="#291318" stroke="#FB7185" stroke-width="2"/>
<text x="881" y="280" class="t head">Not exposed</text>
<g fill="#FB7185">
<circle cx="893" cy="333" r="6"/><circle cx="893" cy="383" r="6"/><circle cx="893" cy="433" r="6"/><circle cx="893" cy="483" r="6"/><circle cx="893" cy="533" r="6"/><circle cx="893" cy="583" r="6"/><circle cx="893" cy="633" r="6"/>
</g>
<text x="916" y="341" class="t body">Arbitrary shell</text>
<text x="916" y="391" class="t body">Unrestricted filesystem writes</text>
<text x="916" y="441" class="t body">Arbitrary processes</text>
<text x="916" y="491" class="t body">Recursive jobs</text>
<text x="916" y="541" class="t body">Second AI-only backend</text>
<text x="916" y="591" class="t body">Public NO_AUTH root plane</text>
<text x="916" y="641" class="t body">Managed-inventory bypass</text>
<rect x="881" y="665" width="590" height="40" rx="13" fill="#39171C"/><text x="1040" y="692" class="t small">Explicit capabilities only</text>

<rect x="365" y="770" width="870" height="92" rx="24" class="soft"/>
<text x="420" y="810" class="t head">Policy boundary</text>
<text x="420" y="846" class="t small m">Each surface may expose a smaller subset.</text>

</svg>