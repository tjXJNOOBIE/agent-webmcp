<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Bounded Safety Model</title><desc id="desc">Agent WebMCP exposes typed managed service and job operations while intentionally excluding arbitrary shell, unrestricted filesystem mutation, and arbitrary process execution.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B0F"/><stop offset="1" stop-color="#10151D"/></linearGradient><style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#F8FAFC}.m{fill:#A8B3C4}.title{font-size:66px;font-weight:760;letter-spacing:-1.3px}.sub{font-size:30px}.head{font-size:34px;font-weight:700}.body{font-size:27px}.small{font-size:24px}.soft{fill:#0D141E;stroke:#263243;stroke-width:2}</style></defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/><text x="82" y="102" class="t title">Bounded by Design</text><text x="82" y="148" class="t sub m">Useful operational power without turning the browser into a remote shell.</text>
<rect x="82" y="220" width="680" height="505" rx="32" fill="#0D211D" stroke="#34D399" stroke-width="2"/><text x="125" y="286" class="t head">Exposed as typed operations</text><text x="125" y="344" class="t body">✓ System status + metrics</text><text x="125" y="394" class="t body">✓ Managed service discovery + inspection</text><text x="125" y="444" class="t body">✓ Start / stop / restart / reload</text><text x="125" y="494" class="t body">✓ Service logs and recent output</text><text x="125" y="544" class="t body">✓ Add / remove managed inventory entries</text><text x="125" y="594" class="t body">✓ Durable jobs + execution history</text><text x="125" y="644" class="t body">✓ Optional Codex-assisted job prompts</text><rect x="125" y="670" width="590" height="40" rx="13" fill="#103128"/><text x="180" y="698" class="t small">Every mutation passes through known domain behavior.</text>
<rect x="838" y="220" width="680" height="505" rx="32" fill="#291318" stroke="#FB7185" stroke-width="2"/><text x="881" y="286" class="t head">Intentionally not exposed</text><text x="881" y="344" class="t body">✕ Arbitrary shell commands</text><text x="881" y="394" class="t body">✕ Unrestricted filesystem mutation</text><text x="881" y="444" class="t body">✕ Arbitrary process execution</text><text x="881" y="494" class="t body">✕ Recursive job execution</text><text x="881" y="544" class="t body">✕ Hidden second AI-only backend</text><text x="881" y="594" class="t body">✕ Public NO_AUTH root control plane</text><text x="881" y="644" class="t body">✕ Tool behavior that bypasses managed inventory</text><rect x="881" y="670" width="590" height="40" rx="13" fill="#39171C"/><text x="938" y="698" class="t small">Capability stays explicit, reviewable, and testable.</text>
<rect x="365" y="770" width="870" height="92" rx="24" class="soft"/><text x="420" y="810" class="t head">Policy boundary</text><text x="420" y="846" class="t small m">Different surfaces may expose a smaller subset of the same canonical catalog.</text>
</svg>