<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bounded Safety Model</title><desc id="desc">Agent WebMCP exposes typed managed service and job operations while intentionally excluding arbitrary shell, unrestricted filesystem mutation, and arbitrary process execution.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090d13"/><stop offset="1" stop-color="#111827"/></linearGradient><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.m{fill:#94a3b8}.h{font-size:52px;font-weight:700}.s{font-size:24px}.k{font-size:28px;font-weight:650}.b{font-size:21px}.safe{fill:#09251f;stroke:#34d399;stroke-width:2}.deny{fill:#2a1115;stroke:#fb7185;stroke-width:2}.mid{fill:#0f172a;stroke:#334155;stroke-width:2}.bar{fill:#0b1420;stroke:#334155;stroke-width:2}</style></defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><text x="90" y="105" class="t h">Bounded by Design</text><text x="90" y="148" class="t s m">Useful operational power without turning the browser into a remote shell.</text>

  <rect x="90" y="235" width="610" height="470" rx="34" class="safe"/><text x="135" y="300" class="t k">Exposed as typed operations</text><text x="135" y="350" class="t b">✓ System status + metrics</text><text x="135" y="395" class="t b">✓ Managed service discovery + inspection</text><text x="135" y="440" class="t b">✓ Start / stop / restart / reload</text><text x="135" y="485" class="t b">✓ Service logs and recent output</text><text x="135" y="530" class="t b">✓ Add / remove managed inventory entries</text><text x="135" y="575" class="t b">✓ Durable jobs + execution history</text><text x="135" y="620" class="t b">✓ Optional Codex-assisted job prompts</text><rect x="135" y="650" width="520" height="34" rx="12" fill="#0a332a"/><text x="200" y="675" class="t b">Every mutation passes through known domain behavior.</text>

  <rect x="900" y="235" width="610" height="470" rx="34" class="deny"/><text x="945" y="300" class="t k">Intentionally not exposed</text><text x="945" y="350" class="t b">✕ Arbitrary shell commands</text><text x="945" y="395" class="t b">✕ Unrestricted filesystem mutation</text><text x="945" y="440" class="t b">✕ Arbitrary process execution</text><text x="945" y="485" class="t b">✕ Recursive job execution</text><text x="945" y="530" class="t b">✕ Hidden second AI-only backend</text><text x="945" y="575" class="t b">✕ Public NO_AUTH root control plane</text><text x="945" y="620" class="t b">✕ Tool behavior that bypasses managed inventory</text><rect x="945" y="650" width="520" height="34" rx="12" fill="#39171c"/><text x="1000" y="675" class="t b">Capability stays explicit, reviewable, and testable.</text>

  <rect x="385" y="755" width="830" height="86" rx="24" class="bar"/><text x="445" y="793" class="t k">Policy boundary</text><text x="445" y="824" class="t b m">Different surfaces may expose a smaller subset of the same canonical catalog.</text>
</svg>