<!doctype html>
<html lang="en">
<head>

<title>Agent WebMCP · Fleet Cockpit</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090c0f;color:#e7ebef;font:13px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{color:#8e98a1}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;background:#7e8791}.good{color:#a8d7bd}.warn{color:#e0bd83}.bad{color:#dfaaac}.dot.good{background:#6fc99a}.dot.warn{background:#d9aa62}.dot.bad{background:#dc7f82}.shell{min-height:100vh;background:#090c0f}.topbar{min-height:54px;display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #202830;background:#0b0f13;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:9px}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#e6eaee;color:#0b0f13;font-size:10px;font-weight:900}.brand-copy strong,.brand-copy small{display:block}.brand-copy small{margin-top:1px;color:#8e98a1;font-size:10px}.grow{flex:1}.pill{min-height:30px;display:inline-flex;align-items:center;gap:7px;padding:0 9px;border:1px solid #29333b;border-radius:999px;background:#10161b;font-size:11px}.pill.danger{border-color:#4a2e31;color:#e1aaac}.layout{display:grid;grid-template-columns:150px minmax(0,1fr);min-height:420px}.rail{padding:12px 9px;border-right:1px solid #202830;background:#0b0f13}.nav{display:grid;gap:3px}.nav button{min-height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border:0;border-radius:6px;background:transparent;color:#aab3bb;text-align:left}.nav button:hover{background:#11171d;color:#edf0f2}.nav button.active{background:#171e24;color:#f2f4f5}.nav em{font-style:normal;color:#79838c;font:10px ui-monospace,monospace}.scope-note{margin-top:14px;padding:10px;border-top:1px solid #202830;color:#8f99a2;font-size:10px;line-height:1.45}.main{min-width:0;padding:0 18px 24px}.head{min-height:84px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #202830}.head h1{margin:3px 0;font-size:22px;letter-spacing:-.025em}.head p{margin:0;color:#a3adb5;line-height:1.45}.kicker{color:#909aa4;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.button{min-height:34px;padding:0 11px;border:1px solid #2b343d;border-radius:7px;background:#11171d;font-weight:650}.button:hover:not(:disabled){background:#182027}.button.primary{background:#e5e9ed;color:#0c1014;border-color:#e5e9ed}.button.danger{border-color:#4b2d31;background:#171114;color:#e9b1b3}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:16px 0;border-bottom:1px solid #202830}.metric{min-width:0;padding:0 14px;border-right:1px solid #202830}.metric:first-child{padding-left:0}.metric:last-child{border:0}.metric strong{display:block;font-size:19px;overflow-wrap:anywhere}.metric small{display:block;margin-top:4px;color:#98a2ab}.section{padding-top:18px}.section-head{min-height:42px;display:flex;align-items:center;gap:12px}.section-head h2{margin:0;font-size:16px}.section-head p{margin:2px 0 0;color:#929ca5}.section-head .actions{margin-left:auto}.card{padding:14px;border:1px solid #202830;border-radius:9px;background:#0c1115}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.fact{min-width:0;padding-top:8px;border-top:1px solid #28313a}.fact span,.fact strong{display:block}.fact span{color:#929ca5;font-size:10px}.fact strong{margin-top:4px;overflow-wrap:anywhere}.table-wrap{max-width:100%;overflow:auto;border-top:1px solid #28313a}.table{min-width:660px}.row{display:grid;align-items:center;gap:10px;min-height:52px;padding:8px 9px;border-bottom:1px solid #1f272e}.row.head{min-height:36px;color:#909aa4;font-size:10px}.row.button-row{width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left}.row.button-row:hover{background:#11171d}.service-row{grid-template-columns:minmax(210px,1.6fr) 100px 90px 110px}.agent-row{grid-template-columns:minmax(190px,1.4fr) 90px 110px minmax(150px,1fr)}.job-row{grid-template-columns:minmax(160px,1fr) minmax(150px,1fr) 105px 130px}.identity strong,.identity small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.identity small{margin-top:3px;color:#89939c}.state{display:inline-flex;align-items:center;gap:6px}.console{margin-top:12px;border:1px solid #242d35;border-radius:8px;background:#07090b;overflow:hidden}.console-head{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 10px;border-bottom:1px solid #242d35}.console pre{min-height:100px;max-height:260px;overflow:auto;margin:0;padding:11px;white-space:pre-wrap;overflow-wrap:anywhere;color:#c6d0d8;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.lifecycle{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:12px}.finding{padding:8px 0;border-bottom:1px solid #202830}.finding:last-child{border:0}.trace{margin-top:12px}.trace-entry{display:grid;grid-template-columns:120px 58px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid #1d252c;font-size:11px}.bars{display:grid;gap:10px;margin-top:13px}.bar-line{display:grid;grid-template-columns:90px minmax(0,1fr) 70px;gap:8px;align-items:center}.bar{height:8px;border-radius:999px;background:#182027;overflow:hidden}.bar i{display:block;height:100%;background:#aab4bd;border-radius:inherit}.empty{min-height:120px;display:grid;place-items:center;align-content:center;gap:6px;padding:18px;text-align:center;color:#929ca5;border:1px dashed #28313a;border-radius:8px}.scope-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.scope-card{padding:13px;border:1px solid #202830;border-radius:8px;background:#0c1115}.scope-card strong{display:flex;align-items:center;gap:7px}.scope-card p{margin:6px 0 0;color:#9aa4ad;line-height:1.45}.loading{min-height:250px;display:grid;place-items:center;align-content:center;gap:9px;color:#9aa4ad}.spinner{width:22px;height:22px;border:2px solid #2d3740;border-top-color:#c3ccd3;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;left:50%;bottom:14px;z-index:100;max-width:calc(100vw - 28px);padding:9px 12px;border:1px solid #36414a;border-radius:8px;background:#171e24;opacity:0;transform:translate(-50%,7px);pointer-events:none;transition:.15s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{border-color:#5a3034;color:#e7b3b5}.back{margin-bottom:10px}.runtime-error{padding:12px;border:1px solid #4b2d31;border-radius:8px;background:#141012;color:#dfaaac}.skeleton{height:14px;border-radius:4px;background:#151d23;animation:pulse 1.2s ease-in-out infinite alternate}@keyframes pulse{to{opacity:.45}}
@media(max-width:760px){.layout{grid-template-columns:1fr}.rail{position:sticky;top:54px;z-index:15;padding:7px 9px;border-right:0;border-bottom:1px solid #202830;overflow:auto}.nav{display:flex;min-width:max-content}.nav button{min-width:max-content}.scope-note{display:none}.main{padding:0 12px 20px}.head{min-height:74px}.head p{display:none}.actions.header-actions{display:none}.metrics{grid-template-columns:1fr 1fr}.metric{padding:10px;border-right:0;border-bottom:1px solid #202830}.metric:nth-child(odd){border-right:1px solid #202830}.metric:nth-last-child(-n+2){border-bottom:0}.facts{grid-template-columns:1fr 1fr}.grid,.scope-grid{grid-template-columns:1fr}}
@media(max-width:460px){.brand-copy small,.pill span.label{display:none}.main{padding:0 9px 16px}.head h1{font-size:20px}.facts{grid-template-columns:1fr}.lifecycle{grid-template-columns:1fr 1fr}.trace-entry{grid-template-columns:1fr}.bar-line{grid-template-columns:72px minmax(0,1fr) 56px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="mark">AW</div><div class="brand-copy"><strong>Agent WebMCP</strong><small>Fleet Cockpit · MCP App</small></div></div>
    <div class="grow"></div>
    <span class="pill" id="bridge-pill"><i class="dot warn"></i><span class="label">Connecting</span></span>
    <span class="pill danger" id="auth-pill"><i class="dot bad"></i>NO_AUTH</span>
  </header>
  <div class="layout">
    <aside class="rail"><nav class="nav" id="nav">
      <button class="active" data-page="overview">Overview <em>01</em></button>
      <button data-page="services">Services <em id="service-count">—</em></button>
      <button data-page="agents">Agents <em id="agent-count">—</em></button>
      <button data-page="jobs">Jobs <em id="job-count">—</em></button>
      <button data-page="scope">Scope <em>16</em></button>
    </nav><div class="scope-note"><strong>Bounded MCP surface</strong><br>Service lifecycle, diagnostics, metrics, agents, and durable job evidence. No shell.</div></aside>
    <main class="main" id="root"><div class="loading"><span class="spinner"></span><strong>Opening Fleet Cockpit</strong><small>Negotiating the MCP Apps bridge.</small></div></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';
const state={page:'overview',system:null,services:[],service:null,serviceLogs:null,diagnostics:null,agents:[],agent:null,jobs:[],job:null,jobLogs:null,metrics:null,busy:new Set(),ready:false};
const root=document.getElementById('root'), byId=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opt=v=>v==null?'':(typeof v==='object'&&'present' in v?(v.present?v.value:''):(typeof v==='object'&&'value' in v?v.value:v));
const tone=s=>['RUNNING','SUCCEEDED','ONLINE','UP'].includes(String(s))?'good':['FAILED','DEGRADED','TIMED_OUT','CANCELLED'].includes(String(s))?'bad':'warn';
const when=v=>v?new Date(v).toLocaleString():'—';
const bytes=n=>{n=Number(n||0);if(n<1024)return n+' B';if(n<1024**2)return(n/1024).toFixed(1)+' KB';if(n<1024**3)return(n/1024**2).toFixed(1)+' MB';return(n/1024**3).toFixed(1)+' GB'};
const duration=ms=>{ms=Number(ms||0);if(ms<1000)return ms+' ms';if(ms<60000)return(ms/1000).toFixed(1)+' s';if(ms<3600000)return(ms/60000).toFixed(1)+' min';return(ms/3600000).toFixed(1)+' h'};
let toastTimer;function toast(message,error=false){const n=byId('toast');n.textContent=message;n.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.className='toast',2600)}
function executionOutput(result){const structured=result?.structuredContent??result?.toolOutput??result;if(structured?.status==='FAILURE')throw new Error(structured?.error?.message||'Operation failed');return structured?.output!==undefined?structured.output:structured}

let seq=0;const pending=new Map();let initialized=false;
function rpc(method,params={}){return new Promise((resolve,reject)=>{const id='agent-webmcp-ui-'+(++seq);pending.set(id,{resolve,reject});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');setTimeout(()=>{if(pending.delete(id))reject(new Error('MCP Apps bridge request timed out'))},15000)})}
async function initializeBridge(){
  if(window.openai?.callTool){setBridge('ChatGPT bridge');initialized=true;return}
  const init=await rpc('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'Agent WebMCP Fleet Cockpit',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen']}});
  initialized=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');setBridge(init?.hostInfo?.name||'MCP Apps');
}
function setBridge(label){const n=byId('bridge-pill');n.innerHTML='<i class="dot good"></i><span class="label">'+esc(label)+'</span>'}
async function callTool(name,args={}){
  state.busy.add(name);renderBusy();
  try{let result;if(window.openai?.callTool)result=await window.openai.callTool(name,args);else result=await rpc('tools/call',{name,arguments:args});return executionOutput(result)}finally{state.busy.delete(name);renderBusy()}
}
window.addEventListener('message',event=>{const msg=event.data;if(!msg||msg.jsonrpc!=='2.0')return;if(msg.id&&pending.has(msg.id)){const p=pending.get(msg.id);pending.delete(msg.id);msg.error?p.reject(new Error(msg.error.message||'MCP Apps bridge error')):p.resolve(msg.result);return}if(msg.method==='ui/notifications/tool-result'){seedInitial(msg.params);return}if(msg.method==='ui/notifications/tool-input'){return}if(msg.method==='ui/resource-teardown'){parent.postMessage({jsonrpc:'2.0',id:msg.id,result:{}},'*')}});
function seedInitial(params){try{const out=executionOutput(params);if(out?.operationCount!==undefined){state.system=out;state.ready=true;updateChrome();hydrate().catch(showError)}}catch{}}
function renderBusy(){document.querySelectorAll('[data-tool]').forEach(n=>n.disabled=state.busy.has(n.dataset.tool))}

function head(title,kicker,description,actions=''){return '<header class="head"><div><span class="kicker">'+esc(kicker)+'</span><h1>'+esc(title)+'</h1><p>'+esc(description)+'</p></div><div class="actions header-actions">'+actions+'</div></header>'}
function status(s){return '<span class="state '+tone(s)+'"><i class="dot '+tone(s)+'"></i>'+esc(s||'UNKNOWN')+'</span>'}
function fact(label,value,cls=''){return '<div class="fact"><span>'+esc(label)+'</span><strong class="'+cls+'">'+esc(value??'—')+'</strong></div>'}
function updateChrome(){if(state.system){byId('auth-pill').innerHTML='<i class="dot '+(state.system.authMode==='NO_AUTH'?'bad':'good')+'"></i>'+esc(state.system.authMode);byId('service-count').textContent=state.services.length||'—';byId('agent-count').textContent=state.agents.length||'0';byId('job-count').textContent=state.jobs.length||'0'}}
function setPage(page){state.page=page;document.querySelectorAll('[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===page));render()}

function renderOverview(){const s=state.system||{},m=state.metrics?.metrics||{};const cpu=Math.max(0,Math.min(1,Number(m.systemCpuLoad||0))),memTotal=Number(m.totalPhysicalMemoryBytes||0),memUsed=memTotal?1-Number(m.freePhysicalMemoryBytes||0)/memTotal:0;root.innerHTML=head('Fleet Cockpit','ChatGPT · MCP App','Live bounded operational state from the same canonical Agent WebMCP runtime.','<button class="button" data-refresh>Refresh all</button>')+'<section class="metrics"><div class="metric"><strong>'+esc(state.services.filter(x=>x.state==='RUNNING').length)+' / '+esc(state.services.length)+'</strong><small>Managed services running</small></div><div class="metric"><strong>'+esc(state.agents.filter(x=>x.state==='ONLINE').length)+'</strong><small>Runtime agents online</small></div><div class="metric"><strong>'+esc(state.jobs.filter(x=>['QUEUED','RUNNING','SCHEDULED'].includes(x.state)).length)+'</strong><small>Jobs active / scheduled</small></div><div class="metric"><strong>'+esc(s.operationCount||23)+'</strong><small>Canonical operations</small></div></section><section class="section grid"><article class="card"><span class="kicker">Runtime</span><h2>Agent WebMCP</h2><div class="facts">'+fact('Version',s.version,'mono')+fact('Java',s.javaVersion,'mono')+fact('Service provider',s.serviceProvider)+fact('Metrics provider',s.metricsProvider)+fact('Job provider',s.jobProvider)+fact('Codex',s.codex?.available?(s.codex.version||'available'):'Unavailable')+'</div></article><article class="card"><span class="kicker">Resource snapshot</span><h2>Local target</h2><div class="bars"><div class="bar-line"><span>System CPU</span><div class="bar"><i style="width:'+Math.round(cpu*100)+'%"></i></div><strong>'+Math.round(cpu*100)+'%</strong></div><div class="bar-line"><span>Memory</span><div class="bar"><i style="width:'+Math.round(memUsed*100)+'%"></i></div><strong>'+Math.round(memUsed*100)+'%</strong></div><div class="bar-line"><span>Heap</span><div class="bar"><i style="width:'+(m.heapMaxBytes?Math.round(Number(m.heapUsedBytes||0)/Number(m.heapMaxBytes)*100):0)+'%"></i></div><strong>'+esc(bytes(m.heapUsedBytes))+'</strong></div></div><div class="facts">'+fact('Processors',m.availableProcessors)+fact('Uptime',duration(m.uptimeMillis))+fact('Captured',when(m.capturedAt))+'</div></article></section><section class="section scope-card"><strong><i class="dot warn"></i>Bounded remote authority</strong><p>This embedded app can inspect and control enrolled services, run diagnostics, read bounded logs, inspect runtime agents, metrics, and durable job evidence. Service discovery and job creation stay on the operator browser surface.</p></section>'}
function renderServices(){const rows=state.services.map(s=>'<button class="row button-row service-row" data-service="'+esc(s.id)+'"><span class="identity"><strong>'+esc(s.description||s.id)+'</strong><small class="mono">'+esc(s.id)+'</small></span><span>'+status(s.state)+'</span><span class="mono">'+esc(s.subState||'—')+'</span><span>Inspect ›</span></button>').join('');root.innerHTML=head('Managed Services','Services','Provider-backed service state. Enrollment remains the authority boundary.','<button class="button" data-tool="service.list" data-refresh-services>Refresh</button>')+'<section class="section">'+(rows?'<div class="table-wrap"><div class="table"><div class="row head service-row"><span>Service</span><span>State</span><span>Substate</span><span></span></div>'+rows+'</div></div>':'<div class="empty"><strong>No managed services</strong><small>Discovery is an operator workflow outside this bounded MCP app.</small></div>')+'</section>'}
function renderService(){const d=state.service;if(!d){renderServices();return}const meta=d.providerMetadata||{};const diag=state.diagnostics;root.innerHTML='<div class="section back"><button class="button" data-back-services>← Services</button></div>'+head(d.description||d.id,'Service Control',d.id,'<button class="button" data-tool="service.logs" data-service-logs>Logs</button><button class="button" data-tool="service.diagnostics" data-diagnostics>Diagnostics</button>')+'<section class="section card"><div class="facts">'+fact('State',d.state+' / '+(d.subState||'—'))+fact('PID',d.pid,'mono')+fact('Memory',bytes(d.memoryBytes))+fact('CPU time',(Number(d.cpuUsageNanoseconds||0)/1e9).toFixed(1)+' s')+fact('Unit file',meta.UnitFileState||'unknown')+fact('Working directory',meta.WorkingDirectory||'not reported','mono')+'</div><div class="lifecycle"><button class="button" data-lifecycle="service.start" data-tool="service.start">Start</button><button class="button" data-lifecycle="service.stop" data-tool="service.stop">Stop</button><button class="button primary" data-lifecycle="service.restart" data-tool="service.restart">Restart</button><button class="button" data-lifecycle="service.reload" data-tool="service.reload">Reload</button></div></section><section class="section"><div class="section-head"><div><h2>Service console</h2><p>Bounded recent provider output. Not a shell.</p></div></div><div class="console"><div class="console-head"><strong class="mono">'+esc(d.id)+'</strong><span class="muted">'+(state.serviceLogs?'loaded':'not loaded')+'</span></div><pre>'+esc(state.serviceLogs?.output||'Use Logs to load bounded recent output.')+'</pre></div></section>'+(diag?'<section class="section card"><span class="kicker">Diagnostics</span><h2 class="'+(diag.healthy?'good':'bad')+'">'+(diag.healthy?'Healthy':'Findings present')+'</h2><div>'+((diag.findings||[]).map(f=>'<div class="finding">'+esc(f)+'</div>').join('')||'<div class="finding good">No diagnostic findings.</div>')+'</div></section>':'') }
function renderAgents(){const rows=state.agents.map(a=>'<button class="row button-row agent-row" data-agent="'+esc(a.id)+'"><span class="identity"><strong>'+esc(a.displayName)+'</strong><small class="mono">'+esc(a.id)+'</small></span><span>'+status(a.state)+'</span><span>'+esc(a.targetId)+'</span><span>'+esc(when(a.lastHeartbeatAt))+'</span></button>').join('');const detail=state.agent?'<article class="card"><span class="kicker">Selected agent</span><h2>'+esc(state.agent.displayName)+'</h2><div class="facts">'+fact('State',state.agent.state)+fact('Target',state.agent.targetId)+fact('Runtime',state.agent.runtimeKind)+fact('Version',state.agent.runtimeVersion,'mono')+fact('Heartbeat',when(state.agent.lastHeartbeatAt))+fact('Capabilities',(state.agent.capabilities||[]).join(', '))+'</div></article>':'';root.innerHTML=head('Agent Registry','Agents','Observed runtime executors, heartbeat probes, target binding, runtime identity, and capabilities.','<button class="button" data-tool="agent.list" data-refresh-agents>Refresh agents</button>')+'<section class="section">'+(rows?'<div class="table-wrap"><div class="table"><div class="row head agent-row"><span>Agent</span><span>State</span><span>Target</span><span>Heartbeat</span></div>'+rows+'</div></div>':'<div class="empty"><strong>No runtime agents observed</strong><small>Agent WebMCP only reports executors it can actually probe.</small></div>')+'</section>'+(detail?'<section class="section">'+detail+'</section>':'') }
function renderJobs(){const rows=state.jobs.map(j=>'<button class="row button-row job-row" data-job="'+esc(j.id)+'"><span class="identity"><strong class="mono">'+esc(j.id)+'</strong><small>'+esc(j.serviceId||'—')+'</small></span><span>'+esc(j.kind||'job')+'</span><span>'+status(j.state)+'</span><span>'+esc(when(j.nextRunAt||j.completedAt||j.createdAt))+'</span></button>').join('');const j=state.job;let detail='';if(j){const recurring=opt(j.repeatEverySeconds);detail='<article class="card"><span class="kicker">Durable job evidence</span><h2 class="mono">'+esc(j.id)+'</h2><div class="facts">'+fact('State',j.state)+fact('Service',j.serviceId,'mono')+fact('Operation',j.operationId,'mono')+fact('Kind',j.kind)+fact('Agent',opt(j.agentId)||'none')+fact('Cadence',recurring?recurring+' seconds':'one-shot')+fact('Scheduled',when(j.scheduledFor))+fact('Started',when(j.startedAt))+fact('Completed',when(j.completedAt))+'</div><div class="console"><div class="console-head"><strong>Result / evidence</strong></div><pre>'+esc(j.output||j.failureReason||(j.execution?JSON.stringify(j.execution,null,2):'No final result yet.'))+'</pre></div><div class="trace"><h3>Execution Trace</h3>'+((state.jobLogs?.entries||[]).map(e=>'<div class="trace-entry"><time>'+esc(when(e.at))+'</time><strong>'+esc(e.level)+'</strong><span>'+esc(e.message)+'</span></div>').join('')||'<div class="empty">No trace entries recorded.</div>')+'</div></article>'}root.innerHTML=head('Durable Jobs','Jobs · Read-only MCP view','Inspect schedule state, agent attribution, result evidence, and execution trace. Job authoring remains an operator workflow.','<button class="button" data-tool="job.list" data-refresh-jobs>Refresh jobs</button>')+'<section class="section grid"><div>'+(rows?'<div class="table-wrap"><div class="table"><div class="row head job-row"><span>Job</span><span>Kind</span><span>State</span><span>Time</span></div>'+rows+'</div></div>':'<div class="empty"><strong>No durable jobs</strong><small>Create jobs from the operator Fleet Cockpit, then inspect their evidence here.</small></div>')+'</div><div>'+detail+'</div></section>'}
function renderScope(){const allowed=['System status & metrics','Agent registry & monitoring','Managed service list/inspect/status','Bounded service logs & diagnostics','Service start/stop/restart/reload','Durable job list/inspect/logs'];const blocked=['Service discovery & enrollment','Managed inventory add/remove','Target workflows','Job creation & cancellation','Generic shell / arbitrary process execution','Browser-supplied working directories'];root.innerHTML=head('Capability Boundary','MCP Scope','The embedded app mirrors the intentional 16-tool remote projection, not the full operator HTTP surface.')+'<section class="section scope-grid">'+allowed.map(x=>'<div class="scope-card"><strong class="good"><i class="dot good"></i>'+esc(x)+'</strong><p>Available through the canonical MCP tool projection.</p></div>').join('')+blocked.map(x=>'<div class="scope-card"><strong class="muted"><i class="dot warn"></i>'+esc(x)+'</strong><p>Intentionally kept outside the bounded remote MCP app.</p></div>').join('')+'</section>'}
function render(){if(!state.ready){return}if(state.page==='overview')renderOverview();else if(state.page==='services')state.service?renderService():renderServices();else if(state.page==='agents')renderAgents();else if(state.page==='jobs')renderJobs();else renderScope();updateChrome();renderBusy();notifySize()}
function notifySize(){requestAnimationFrame(()=>{const h=Math.ceil(document.documentElement.scrollHeight);if(window.openai?.notifyIntrinsicHeight)window.openai.notifyIntrinsicHeight(h);else if(initialized)parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{height:h}},'*')})}
function showError(error){state.ready=true;root.innerHTML='<div class="section"><div class="runtime-error"><strong>Fleet Cockpit could not load</strong><br>'+esc(error?.message||error)+'</div></div>';toast(error?.message||String(error),true);notifySize()}
async function hydrate(){const calls=[];if(!state.system)calls.push(callTool('system.status').then(v=>state.system=v));calls.push(callTool('service.list').then(v=>state.services=v||[]),callTool('agent.list').then(v=>state.agents=v||[]),callTool('job.list',{limit:100}).then(v=>state.jobs=v||[]),callTool('metrics.snapshot').then(v=>state.metrics=v));await Promise.all(calls);state.ready=true;render()}
async function refreshAll(){await Promise.all([callTool('system.status').then(v=>state.system=v),callTool('service.list').then(v=>state.services=v||[]),callTool('agent.list').then(v=>state.agents=v||[]),callTool('job.list',{limit:100}).then(v=>state.jobs=v||[]),callTool('metrics.snapshot').then(v=>state.metrics=v)]);toast('Fleet state refreshed');render()}
async function openService(id){state.service=await callTool('service.inspect',{serviceId:id});state.serviceLogs=null;state.diagnostics=null;render()}
async function openAgent(id){state.agent=await callTool('agent.inspect',{agentId:id});render()}
async function openJob(id){const [j,l]=await Promise.all([callTool('job.inspect',{jobId:id}),callTool('job.logs',{jobId:id,lines:500})]);state.job=j;state.jobLogs=l;render()}
async function serviceAction(id){if(!state.service)return;const verb=id.split('.')[1];if(['stop','restart'].includes(verb)&&!confirm(verb[0].toUpperCase()+verb.slice(1)+' '+state.service.id+'?'))return;await callTool(id,{serviceId:state.service.id});state.service=await callTool('service.inspect',{serviceId:state.service.id});state.services=await callTool('service.list');toast(verb[0].toUpperCase()+verb.slice(1)+' completed');render()}

document.addEventListener('click',async e=>{const n=e.target.closest('button');if(!n)return;try{if(n.dataset.page){state.service=null;setPage(n.dataset.page);return}if(n.hasAttribute('data-refresh')){await refreshAll();return}if(n.hasAttribute('data-refresh-services')){state.services=await callTool('service.list');toast('Services refreshed');render();return}if(n.hasAttribute('data-refresh-agents')){state.agents=await callTool('agent.list');if(state.agent)state.agent=await callTool('agent.inspect',{agentId:state.agent.id});toast('Agents refreshed');render();return}if(n.hasAttribute('data-refresh-jobs')){state.jobs=await callTool('job.list',{limit:100});toast('Jobs refreshed');render();return}if(n.dataset.service){await openService(n.dataset.service);return}if(n.hasAttribute('data-back-services')){state.service=null;render();return}if(n.dataset.agent){await openAgent(n.dataset.agent);return}if(n.dataset.job){await openJob(n.dataset.job);return}if(n.dataset.lifecycle){await serviceAction(n.dataset.lifecycle);return}if(n.hasAttribute('data-service-logs')){state.serviceLogs=await callTool('service.logs',{serviceId:state.service.id,lines:120});toast('Logs loaded');render();return}if(n.hasAttribute('data-diagnostics')){state.diagnostics=await callTool('service.diagnostics',{serviceId:state.service.id});toast(state.diagnostics.healthy?'Diagnostics healthy':'Diagnostics found issues');render();return}}catch(err){console.error(err);toast(err.message||String(err),true)}});
new ResizeObserver(()=>notifySize()).observe(document.body);
(async()=>{try{if(window.openai?.toolOutput){try{const initial=executionOutput(window.openai.toolOutput);if(initial?.operationCount!==undefined)state.system=initial}catch{}}await initializeBridge();await hydrate()}catch(error){showError(error)}})();
})();
</script>
</body>
</html>
